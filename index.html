.gl{font-size:13px;font-weight:500;margin-top:8px;position:sticky;left:0}
.step{display:flex;gap:12px}

.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}

function dl(n,d){
  try{
    var blob = d instanceof Blob ? d : new Blob([d], {type: n.endsWith(".pdf") ? "application/pdf" : "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = n; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)}, 1500);
  }catch(e){alert("Gagal mengunduh file: "+e.message)}
}
